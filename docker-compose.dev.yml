name: vertex-dev

services:
  app-dev:
    build:
      context: .
      target: deps
    image: vertex-platform-dev:latest
    container_name: vertex-app-dev
    working_dir: /app
    network_mode: "host"
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      OLLAMA_URL: http://127.0.0.1:11434
      MATH_SOLVER_URL: http://127.0.0.1:8000
    volumes:
      - .:/app
      - vertex_dev_node_modules:/app/node_modules
    command:
      - npx
      - next
      - dev
      - -H
      - 127.0.0.1
      - -p
      - "3001"
    restart: unless-stopped

volumes:
  vertex_dev_node_modules:
