services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    image: vertex-platform:latest
    container_name: vertex-app
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    environment:
      # Usa el Ollama que ya corre en el host (no levantamos uno nuevo)
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      # En Linux, host.docker.internal no existe por defecto — esto lo activa
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
