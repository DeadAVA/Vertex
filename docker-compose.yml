services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    image: vertex-platform:latest
    container_name: vertex-app
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    environment:
      # Apunta al servicio ollama dentro de la red Docker
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - vertex-net

  ollama:
    image: ollama/ollama:latest
    container_name: vertex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - vertex-net
    # Descomenta si tienes GPU NVIDIA disponible:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  vertex-net:
    driver: bridge

volumes:
  ollama_data:
